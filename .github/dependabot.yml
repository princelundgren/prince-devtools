version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: swift
    directory: /PrinceDevToolsCore
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
    cooldown:
      default-days: 7
